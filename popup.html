<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>mount crawler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="wrap">
  <div class="wrapInner">
    <div class="option">
      <div class="optionToggleButton">Options</div>
      <div class="optionMore">
        <dl class="optionItem">
          <dt>Crawl Target</dt>
          <dd>
            <ul>
              <li><input type="radio" name="targetAll" value="yes" id="targetAllYes" /><label for="targetAllYes">Entire domain</label></li>
              <li><input type="radio" name="targetAll" value="no" id="targetAllNo" checked /><label for="targetAllNo">Current directory and below</label></li>
            </ul>
            <ul>
              <li><input type="radio" name="includeSubDomain" value="no" id="includeSubDomainNo" checked /><label for="includeSubDomainNo">Exclude different subdomains</label></li>
              <li><input type="radio" name="includeSubDomain" value="yes" id="includeSubDomainYes" /><label for="includeSubDomainYes">Include different subdomains</label></li>
            </ul>
            <ul>
              <li><input type="radio" name="skipSimilar" value="no" id="skipSimilarNo" checked /><label for="skipSimilarNo">No skipping</label></li>
              <li><input type="radio" name="skipSimilar" value="yes" id="skipSimilarYes" /><label for="skipSimilarYes">Skip similar URLs [experimental]</label></li>
            </ul>
          </dd>
        </dl>
        <dl class="optionItem">
          <dt>Async Elements</dt>
          <dd>
            <ul>
              <li><input type="radio" name="async" value="no" id="asyncNo" checked /><label for="asyncNo">Don't fetch (fast)</label></li>
              <li><input type="radio" name="async" value="yes" id="asyncYes" /><label for="asyncYes">Fetch (slow)</label></li>
            </ul>
          </dd>
        </dl>
        <dl class="optionItem">
          <dt>URL Query</dt>
          <dd>
            <ul>
              <li><input type="radio" name="queryIgnore" value="yes" id="queryIgnoreYes" checked /><label for="queryIgnoreYes">Ignore</label></li>
              <li><input type="radio" name="queryIgnore" value="no" id="queryIgnoreNo" /><label for="queryIgnoreNo">Don't ignore</label></li>
            </ul>
          </dd>
        </dl>
        <dl class="optionItem">
          <dt>Slow Mode (= Reduce Server Load)</dt>
          <dd>
            <ul>
              <li><input type="radio" name="slow" value="no" id="slowNo" checked /><label for="slowNo">OFF</label></li>
              <li><input type="radio" name="slow" value="yes" id="slowYes" /><label for="slowYes">ON</label></li>
            </ul>
          </dd>
        </dl>
        <dl class="optionItem">
          <dt>Exclude Directories (multiple lines / regex allowed)</dt>
          <dd>
            <textarea name="ignoreDir"></textarea>
            <p class="small">ex. ^/blog/.+, ^https://example.com</p>
          </dd>
        </dl>
      </div>
    </div>
    <p>
      <button id="startButton">Start Crawling</button>
    </p>
    <div class="caption">
      *Cannot run simultaneously in multiple tabs.<br>
    </div>
    <div class="version">
      version: 1.8
    </div>
  </div>
</div>
  <script src="popup.js"></script>
</body>
</html>
